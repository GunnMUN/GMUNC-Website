<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fullscreen Image</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    img.fullscreen {
      position: fixed;     /* stays fixed to viewport */
      inset: 0;            /* top:0; right:0; bottom:0; left:0 */
      width: 100vw;
      height: 100vh;
      object-fit: cover;   /* crop to fill while preserving aspect ratio */
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .overlay {
      position: relative;
      z-index: 1;
      color: white;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <img class="fullscreen" src="GMUNC Map.jpg" alt="GMUNC Map">
</body>
</html>
